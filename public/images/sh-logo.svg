<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="sh-title sh-description">
  <title id="sh-title">SH · Sergio Hernández</title>
  <desc id="sh-description">Monograma geométrico SH dentro de una etiqueta de código.</desc>
  <!-- El monograma ocupa de (16, 20) a (48, 44): centro exacto en ambos ejes. -->
  <rect width="64" height="64" rx="13" fill="#12283c"/>
  <g fill="#f3f8ff">
    <path d="M20 20h10v5h-9v4h5l4 4v7l-4 4H16v-5h9v-4h-5l-4-4v-7z"/>
    <path d="M34 20h5v9h4v-9h5v24h-5v-9h-4v9h-5z"/>
  </g>
  <!-- Los signos de código enmarcan las iniciales sin desplazar su centro. -->
  <g fill="none" stroke="#6bbcff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 26-6 6 6 6m46-12 6 6-6 6"/>
    <path d="m53 27-3 10" stroke-width="1.8"/>
  </g>
</svg>
